<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #262b36;
    --accent: #3b82f6;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== 背景视频 ===== */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  .bg-video.on { opacity: 1; }

  /* ===== 卡片：液态玻璃 ===== */
  .card {
    position: relative;
    z-index: 1;
    max-width: 640px;
    width: 100%;
    background:
      /* 顶部斜射入的环境光 */
      linear-gradient(158deg,
        rgba(255, 255, 255, .10) 0%,
        rgba(255, 255, 255, .025) 18%,
        rgba(255, 255, 255, 0) 42%,
        rgba(255, 255, 255, 0) 78%,
        rgba(255, 255, 255, .04) 100%),
      /* 极薄深色底，保证文字可读 */
      rgba(7, 10, 16, .18);
    backdrop-filter: blur(16px) saturate(200%) brightness(1.08);
    -webkit-backdrop-filter: blur(16px) saturate(200%) brightness(1.08);
    border: none;
    border-radius: 24px;
    padding: 40px 32px;
    overflow: hidden;
    transform-style: preserve-3d;
    box-shadow:
      /* 环境投影：随视角反向偏移，增强悬浮感 */
      calc(var(--px, 0) * -22px) calc(30px + var(--py, 0) * -16px) 70px -30px rgba(0, 0, 0, .85),
      /* 上缘高光：光打在玻璃边缘 */
      inset 0 1.5px 0 rgba(255, 255, 255, .42),
      /* 底部内侧微光 */
      inset 0 -14px 30px -18px rgba(255, 255, 255, .28),
      inset 0 -1px 0 rgba(255, 255, 255, .10);
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s ease;
    animation: cardIn .8s cubic-bezier(.2, .8, .2, 1) backwards,
               floatY 7s ease-in-out 1.2s infinite;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* 悬浮呼吸：用 translate 属性，和 JS 控制的 transform 倾斜互不干扰 */
  @keyframes floatY {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -8px; }
  }
  .card:hover {
    box-shadow:
      calc(var(--px, 0) * -22px) calc(34px + var(--py, 0) * -16px) 80px -30px rgba(59, 130, 246, .45),
      inset 0 1.5px 0 rgba(255, 255, 255, .55),
      inset 0 -14px 30px -18px rgba(255, 255, 255, .36),
      inset 0 -1px 0 rgba(255, 255, 255, .14);
  }

  /* 立体分层：越“靠近”观看者的层，视差位移越大 */
  h1, .sub, p, .tags, footer {
    transition: translate .35s cubic-bezier(.2, .8, .2, 1);
  }
  h1      { translate: calc(var(--px, 0) * 10px) calc(var(--py, 0) * 8px); }
  .sub    { translate: calc(var(--px, 0) * 7px)  calc(var(--py, 0) * 5px); }
  p       { translate: calc(var(--px, 0) * 5px)  calc(var(--py, 0) * 4px); }
  .tags   { translate: calc(var(--px, 0) * 8px)  calc(var(--py, 0) * 6px); }
  .card a { translate: calc(var(--px, 0) * 12px) calc(var(--py, 0) * 9px); }
  footer  { translate: calc(var(--px, 0) * 3px)  calc(var(--py, 0) * 2px); }

  /* 玻璃上缓慢划过的高光（更宽更柔，像天光掠过） */
  .sheen {
    position: absolute;
    top: -60%;
    left: -80%;
    width: 70%;
    height: 220%;
    pointer-events: none;
    background: linear-gradient(90deg,
      transparent,
      rgba(255, 255, 255, .05) 30%,
      rgba(255, 255, 255, .14) 48%,
      rgba(255, 255, 255, .22) 50%,
      rgba(255, 255, 255, .14) 52%,
      rgba(255, 255, 255, .05) 70%,
      transparent);
    transform: rotate(18deg);
    animation: sheenMove 9s ease-in-out 1.4s infinite;
  }
  @keyframes sheenMove {
    0%        { transform: translateX(0) rotate(18deg); }
    72%, 100% { transform: translateX(300%) rotate(18deg); }
  }

  /* 鼠标跟随光晕（白里透蓝的“液体”高光） */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      380px circle at var(--mx, 50%) var(--my, 50%),
      rgba(255, 255, 255, .16),
      rgba(120, 170, 255, .10) 42%,
      transparent 70%
    );
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  .card:hover::before { opacity: 1; }

  /* 折射边缘：整圈渐变描边，亮点随鼠标沿边缘流动 */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.2px;
    background:
      radial-gradient(130px 130px at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 255, .9), transparent 70%),
      linear-gradient(155deg,
        rgba(255, 255, 255, .55) 0%,
        rgba(255, 255, 255, .16) 18%,
        rgba(255, 255, 255, .02) 42%,
        rgba(255, 255, 255, .02) 62%,
        rgba(255, 255, 255, .30) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }

  /* 静态折射环：边缘轻微发亮的玻璃厚度 */
  .rim {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(from 210deg,
      rgba(255, 255, 255, .06),
      rgba(255, 255, 255, .30) 12%,
      rgba(255, 255, 255, .05) 28%,
      rgba(255, 255, 255, .02) 50%,
      rgba(255, 255, 255, .20) 82%,
      rgba(255, 255, 255, .06));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }

  /* 顶部镜面高光：液态玻璃标志性的亮边 */
  .spec {
    position: absolute;
    top: 0;
    left: 6%;
    right: 6%;
    height: 44%;
    border-radius: 50% 50% 40% 40%;
    background: radial-gradient(60% 100% at 50% 0%,
      rgba(255, 255, 255, .22),
      rgba(255, 255, 255, .05) 55%,
      transparent 78%);
    filter: blur(6px);
    pointer-events: none;
  }

  /* ===== 布局：两张卡片纵向排列 ===== */
  .layout {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 56px;
  }
  .layout .card { max-width: none; }

  /* ===== 留言板卡片 ===== */
  .card.guestbook {
    animation: cardIn .8s .15s cubic-bezier(.2, .8, .2, 1) backwards,
               floatY 8s ease-in-out 1.5s infinite;
  }
  .gb-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .3px;
    margin-bottom: 6px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .45);
    background: linear-gradient(90deg, #f4f6ff, #a3b8ff, #f4f6ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite, riseIn .7s .2s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  .gb-sub {
    color: #aab4c8;
    font-weight: 600;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .4);
    margin-bottom: 20px;
    animation: riseIn .7s .3s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  #giscus { width: 100%; margin-top: 4px; }
  .giscus-frame { width: 100%; border: none; }
  .gb-wait {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 28px 16px 22px;
    text-align: center;
    color: #8a94a8;
    animation: riseIn .7s .35s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  .gb-wait-icon { font-size: 30px; line-height: 1; }
  .gb-wait-title { font-size: 16px; font-weight: 700; color: #c3cbdb; }
  .gb-wait-sub { font-size: 13px; line-height: 1.7; }
  /* 注意：.gb-wait 自带 display:flex，会盖掉 hidden 属性的 display:none，需显式声明 */
  .gb-wait[hidden] { display: none; }

  /* ===== 标题 ===== */
  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .3px;
    margin-bottom: 8px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .45);
    background: linear-gradient(90deg, #f4f6ff, #a3b8ff, #f4f6ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite, riseIn .7s .1s cubic-bezier(.2, .8, .2, 1) backwards;
    cursor: default;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .sub {
    color: #aab4c8;
    font-weight: 600;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .4);
    margin-bottom: 24px;
    animation: riseIn .7s .2s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  p {
    line-height: 1.8;
    font-weight: 500;
    color: #dde3ee;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .4);
    margin-bottom: 20px;
    animation: riseIn .7s .3s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  /* 补充说明：比正文更低调一行 */
  p.note {
    font-size: 13px;
    line-height: 1.7;
    color: #8e99ad;
    margin-top: -8px;
  }

  /* ===== 标签 ===== */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .tag {
    background: rgba(255, 255, 255, .09);
    border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #cfe0ff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: default;
    transition: transform .25s cubic-bezier(.2, .8, .2, 1),
                background .25s ease, color .25s ease, box-shadow .25s ease;
    animation: tagPop .5s cubic-bezier(.2, .8, .2, 1) backwards;
    animation-delay: calc(.42s + var(--i, 0) * .09s);
  }
  @keyframes tagPop {
    from { opacity: 0; transform: translateY(10px) scale(.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .tag:hover {
    transform: translateY(-3px) scale(1.06);
    background: rgba(255, 255, 255, .16);
    border-color: rgba(255, 255, 255, .28);
    color: #e8efff;
    box-shadow: 0 8px 18px -8px rgba(59, 130, 246, .8);
  }

  /* ===== 按钮 ===== */
  a {
    position: relative;
    display: inline-block;
    overflow: hidden;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    letter-spacing: .2px;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    margin-right: 10px;
    transition: transform .25s cubic-bezier(.2, .8, .2, 1),
                box-shadow .25s ease, background .25s ease,
                translate .3s cubic-bezier(.2, .8, .2, 1);
    animation: riseIn .7s .55s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  a:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px -10px rgba(59, 130, 246, .95);
  }
  a:active { transform: translateY(0) scale(.97); }
  /* 扫光 */
  a::after {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    transition: none;
  }
  a:hover::after { animation: sweep .7s ease; }
  @keyframes sweep {
    to { left: 130%; }
  }
  a.ghost {
    background: transparent;
    border: 1px solid #3a4152;
    color: #c2c8d4;
    animation-delay: .63s;
  }
  a.ghost:hover {
    border-color: #6b7690;
    color: #fff;
    background: rgba(255,255,255,.04);
    box-shadow: 0 12px 26px -14px rgba(255,255,255,.45);
  }

  footer {
    position: relative;
    margin-top: 28px;
    font-size: 13px;
    font-weight: 500;
    color: #6b7486;
    animation: riseIn .7s .7s cubic-bezier(.2, .8, .2, 1) backwards;
  }

  /* 光标小光点（跟随鼠标） */
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: rgba(96, 165, 250, .9);
    box-shadow: 0 0 18px 4px rgba(96, 165, 250, .5);
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    transition: opacity .3s ease;
  }
  body:hover .cursor-dot { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <!-- 背景视频：muted + loop + playsinline，移动端也能自动播放 -->
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto"
         poster="bg-poster.jpg" aria-hidden="true" tabindex="-1">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div class="cursor-dot" id="dot" aria-hidden="true"></div>

  <div class="layout">

    <div class="card" id="card">
      <div class="sheen" aria-hidden="true"></div>
      <div class="rim" aria-hidden="true"></div>
      <div class="spec" aria-hidden="true"></div>
      <h1>你好，我是HEWEIHAN</h1>
      <div class="sub">记录一些折腾和想法</div>
      <p>这个站点用 GitHub Pages 托管，域名通过 Cloudflare 解析。</p>
      <p class="note">现在这个域名还没放多少东西，以后会逐步完善。</p>
      <div class="tags">
        <span class="tag" style="--i:0">前端</span>
        <span class="tag" style="--i:1">折腾服务器</span>
        <span class="tag" style="--i:2">写点东西</span>
        <span class="tag" style="--i:3">搞一些莫名</span>
      </div>
      <a href="https://github.com/heweihan02-alt">GitHub</a>
      <a class="ghost" href="mailto:heweihan9@outlook.com">联系我</a>
      <footer>© 2026 7891789.xyz</footer>
    </div>

    <!-- ===== 留言板 ===== -->
    <div class="card guestbook">
      <div class="sheen" aria-hidden="true"></div>
      <div class="rim" aria-hidden="true"></div>
      <div class="spec" aria-hidden="true"></div>
      <h2 class="gb-title">留言板</h2>
      <div class="gb-sub">路过不妨留个言，欢迎交流</div>

      <!-- Giscus 留言，设置完成后自动加载 -->
      <div class="giscus" id="giscus" hidden></div>

      <!-- 设置完成前的占位 -->
      <div class="gb-wait" id="gbWait">
        <div class="gb-wait-icon" aria-hidden="true">💬</div>
        <div class="gb-wait-title">留言板加载中…</div>
        <div class="gb-wait-sub">正在连接 giscus，请稍候。<br>如果一直看不到留言框，请检查网络后刷新重试。</div>
      </div>
    </div>

  </div>

<script>
  (function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var video = document.getElementById('bgVideo');

    // ===== 背景视频：淡入 + 后台自动暂停 =====
    if (video) {
      var showVideo = function () { video.classList.add('on'); };

      if (reduce) {
        // 尊重系统“减少动态”：只显示首帧（海报）
        video.removeAttribute('autoplay');
        video.pause();
        showVideo();
      } else {
        video.addEventListener('loadeddata', showVideo);
        video.addEventListener('playing', showVideo);
        video.addEventListener('error', function () { video.style.display = 'none'; });
        if (video.readyState >= 2) showVideo();

        // 兜底：如果 2.5 秒后还是全透明（淡入没触发），直接显示
        setTimeout(function () {
          if (getComputedStyle(video).opacity === '0') video.style.opacity = '1';
        }, 2500);

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            video.pause();
          } else {
            var p = video.play();
            if (p && p.catch) p.catch(function () {});
          }
        });
      }
    }

    if (reduce) return;

    var card = document.getElementById('card');
    var dot = document.getElementById('dot');

    // 鼠标光晕跟随 + 3D 倾斜 + 分层视差
    var raf = null;
    var hover = 0;
    var target = { rx: 0, ry: 0, mx: 50, my: 50, px: 0, py: 0 };

    function apply() {
      raf = null;
      card.style.setProperty('--mx', target.mx + '%');
      card.style.setProperty('--my', target.my + '%');
      card.style.setProperty('--px', target.px.toFixed(3));
      card.style.setProperty('--py', target.py.toFixed(3));
      card.style.transform =
        'perspective(900px) rotateX(' + target.rx.toFixed(2) + 'deg) rotateY(' +
        target.ry.toFixed(2) + 'deg) scale(' + (1 + hover * 0.015).toFixed(3) + ')';
    }

    function onMove(e) {
      var pt = e.touches ? e.touches[0] : e;
      var r = card.getBoundingClientRect();
      var x = (pt.clientX - r.left) / r.width;
      var y = (pt.clientY - r.top) / r.height;

      target.mx = x * 100;
      target.my = y * 100;
      target.px = x - 0.5;
      target.py = y - 0.5;
      target.ry = (x - 0.5) * 12;
      target.rx = (0.5 - y) * 12;

      dot.style.transform = 'translate(' + pt.clientX + 'px,' + pt.clientY + 'px)';

      if (!raf) raf = requestAnimationFrame(apply);
    }

    card.addEventListener('mousemove', onMove);
    card.addEventListener('touchmove', onMove, { passive: true });
    card.addEventListener('mouseenter', function () {
      hover = 1;
      if (!raf) raf = requestAnimationFrame(apply);
    });

    card.addEventListener('mouseleave', function () {
      hover = 0;
      target.rx = 0; target.ry = 0; target.px = 0; target.py = 0;
      if (!raf) raf = requestAnimationFrame(apply);
    });

    window.addEventListener('mousemove', function (e) {
      dot.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    });

    // 标签随机轻微浮动，更有生气
    document.querySelectorAll('.tag').forEach(function (t, i) {
      t.animate(
        [
          { translate: '0 0' },
          { translate: '0 -4px' },
          { translate: '0 0' }
        ],
        {
          duration: 2600 + i * 320,
          iterations: Infinity,
          easing: 'ease-in-out',
          delay: 900 + i * 180
        }
      );
    });
  })();
</script>

<script>
  (function () {
    // ============ 留言板（Giscus / GitHub Discussions）============
    // 前置条件：仓库已开启 Discussions + 已安装 giscus App（见《留言板使用说明.md》）
    var GISCUS_ENABLED = true;

    var GISCUS_CONFIG = {
      repo: 'heweihan02-alt/heweihan02-alt.github.io',  // 存放留言的仓库
      repoId: 'MDEwOlJlcG9zaXRvcnkxNDI4NDE5MDcy',        // 仓库 ID（已算好，一般不用改）
      category: 'Announcements',                          // 留言存放的讨论分类
      categoryId: 'DIC_kwDOVSPyAM4DJTqt',                 // 该分类的 ID：首次建帖必须带上，否则会报 Unable to create discussion
      mapping: 'specific',                                // 用固定标题对应到留言帖
      term: 'Guestbook',                                  // 留言帖标题
      theme: 'transparent_dark',                          // 深色透明主题，贴合玻璃卡片
      lang: 'zh-CN'                                       // 界面语言
    };

    var box = document.getElementById('giscus');
    var wait = document.getElementById('gbWait');

    if (!GISCUS_ENABLED) return; // 未完成设置：保持占位显示，不加载也不报错

    if (box) box.hidden = false;

    var s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.setAttribute('data-repo', GISCUS_CONFIG.repo);
    s.setAttribute('data-repo-id', GISCUS_CONFIG.repoId);
    s.setAttribute('data-category', GISCUS_CONFIG.category);
    s.setAttribute('data-category-id', GISCUS_CONFIG.categoryId);
    s.setAttribute('data-mapping', GISCUS_CONFIG.mapping);
    s.setAttribute('data-term', GISCUS_CONFIG.term);
    s.setAttribute('data-strict', '0');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', 'top');
    s.setAttribute('data-theme', GISCUS_CONFIG.theme);
    s.setAttribute('data-lang', GISCUS_CONFIG.lang);
    s.setAttribute('crossorigin', 'anonymous');
    s.async = true;
    document.head.appendChild(s);

    // 留言框加载成功后再收起占位；迟迟不出现就提示可能是网络问题
    var tries = 0;
    var poll = setInterval(function () {
      tries += 1;
      var frame = document.querySelector('.giscus-frame');
      if (frame) {
        clearInterval(poll);
        var hideWait = function () { if (wait) wait.hidden = true; };
        if (frame.classList.contains('giscus-frame--loading')) {
          // 还在加载：等 load 事件；若事件已错过，2.5 秒后兜底收起
          frame.addEventListener('load', hideWait);
          setTimeout(hideWait, 2500);
        } else {
          hideWait(); // 已经加载完了（loading 类已被移除）
        }
        return;
      }
      if (tries === 25) {
        var note = wait && wait.querySelector('.gb-wait-sub');
        if (note) note.textContent = '正在加载留言板…如果一直不出现，多半是网络访问 giscus.app 不畅，稍后刷新再试。';
      }
    }, 400);
  })();
</script>
</body>
</html>
